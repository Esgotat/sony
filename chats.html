<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои чаты — Open University</title>
<meta name="description" content="Личные сообщения между участниками университета.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css?v=17">
</head>
<body data-page="chats">
<header class="hd" id="hd"></header>
<div class="frame">
<nav class="subnav" id="subnav" aria-label="Разделы"></nav>
<main class="content">
<div class="page-head">
<h1 class="page-title">Мои чаты</h1>
</div>
<div class="chats-wrap" id="chatsWrap">
<aside class="chats-side">
<div class="ac-wrap">
<input type="text" id="newChatInput" class="ac-input" placeholder="Начать чат: начните вводить ФИО…" autocomplete="off">
<div class="ac-drop" id="newChatDrop" hidden></div>
</div>
<div class="chats-list" id="chatsList"></div>
</aside>
<section class="chats-main">
<div class="empty" id="noChat">Выберите чат слева или начните новый через поиск по ФИО.</div>
<div id="chatView" hidden>
<div class="chat-head">
<button class="edit-btn" id="chatBack" type="button">←</button>
<b id="chatName"></b>
</div>
<div class="msg-thread" id="chatThread"></div>
<form id="chatForm" class="msg-form">
<textarea id="chatText" rows="2" required placeholder="Сообщение…"></textarea>
<button class="file-btn" type="submit">Отправить</button>
</form>
</div>
</section>
</div>
</main>
</div>
<script src="js/data.js"></script>
<script src="js/store.js?v=5"></script>
<script src="js/icons.js?v=5"></script>
<script src="js/layout.js?v=5"></script>
<script src="js/extract.js?v=1"></script>
<script src="js/app.js?v=10"></script>
</body>
</html>
