<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Публикация — Open University</title>
<meta name="description" content="Карточка научной публикации: рецензии, переводы, комментарии и похожие работы.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css?v=17">
</head>
<body data-page="pub">
<header class="hd" id="hd"></header>
<div class="frame">
<nav class="subnav" id="subnav" aria-label="Разделы"></nav>
<main class="content">
<p class="back"><a href="publications.html">← Все публикации</a></p>
<div id="pubDetail"></div>
<div id="refsBlock"></div>
<div class="pub-actions" id="pubActions" hidden>
<button class="edit-btn" id="pubEditBtn" type="button">✎ Редактировать</button>
<button class="edit-btn danger-btn" id="pubDelBtn" type="button">Удалить</button>
</div>
<h2 class="sub-title">Рецензии</h2>
<div class="comments-list" id="revList"></div>
<div id="reviewZone"></div>
<h2 class="sub-title">Переводы</h2>
<div class="tr-block">
<select class="select tr-select" id="trLang" aria-label="Язык перевода"></select>
<div class="tr-view" id="trView"></div>
<div class="pub-actions">
<button class="edit-btn" id="trAddBtn" type="button" hidden>+ Добавить перевод</button>
</div>
<form class="pub-form" id="trForm" hidden>
<label class="fld"><span>Язык</span><select class="select" id="trFormLang"></select></label>
<label class="fld"><span>Текст перевода (необязательно)</span><textarea id="trText" rows="4"></textarea></label>
<label class="fld">
<span>Файл перевода (PDF или Word)</span>
<input id="trFileInput" type="file" accept=".pdf,.doc,.docx">
<small class="file-hint" id="trFileHint">Прикрепите файл перевода — он будет доступен для скачивания.</small>
</label>
<div class="form-actions"><button class="file-btn" type="submit">Сохранить перевод</button></div>
</form>
</div>
<h2 class="sub-title">Похожие работы</h2>
<section class="cards" id="recCards"></section>
<div class="empty" id="emptyRec" hidden>Похожих работ пока не нашлось.</div>
<h2 class="sub-title">Комментарии · <span id="cCount"></span></h2>
<div class="comments-list" id="commentsList"></div>
<form class="pub-form comment-form" id="commentForm">
<label class="fld">
<span>Ваш комментарий</span>
<textarea id="cText" rows="3" required placeholder="Комментарий будет подписан вашим именем"></textarea>
</label>
<div class="form-actions">
<button class="file-btn" type="submit">Отправить</button>
</div>
</form>
</main>
</div>
<script src="js/data.js"></script>
<script src="js/store.js?v=5"></script>
<script src="js/icons.js?v=5"></script>
<script src="js/layout.js?v=5"></script>
<script src="js/extract.js?v=1"></script>
<script src="js/app.js?v=10"></script>
</body>
</html>
